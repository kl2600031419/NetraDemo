<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Food Ordering Website</title> 
 
<style> 
* { 
    box-sizing: border-box; 
} 
 
body {     font-family: Arial;     margin: 0;     background: #f5f5f5; 
} 
 
header { 
    display: flex;     justify-content: space-between;     align-items: center;     flex-wrap: wrap;     background: orangered;     color: white;     padding: 20px; 
} 
 
nav {     display: flex;     gap: 20px; 
} 
 
nav a {     color: white;     text-decoration: none; 
}  
.container {     width: 90%;     margin: auto; 
}  
.restaurants {     display: grid;     grid-template-columns: 1fr;     gap: 20px; 
}  
.card {     background: white;     padding: 20px;     text-align: center;     border-radius: 10px;     transition: 0.3s; 
}  
.card:hover {     transform: translateY(-5px);     box-shadow: 0 5px 10px #aaa; 
}  
.card img {     width: 100%;     height: 150px;     object-fit: cover;     border-radius: 10px; 
}  
@media (min-width: 600px) { 
    .restaurants {         grid-template-columns: repeat(2, 1fr); 
    } 
} 
 
@media (min-width: 900px) { 
    .restaurants {         grid-template-columns: repeat(3, 1fr); 
    } 
}  
@container (min-width: 250px) { 
    .card h3 {         color: rgb(231, 7, 7); 
    } 
}  
.card {     container-type: inline-size; 
} 
</style> 
</head> 
 
<body> 
 
<header> 
    <h2>Foodie</h2> 
    <nav> 
        <a href="#">Home</a> 
        <a href="#">Restaurants</a> 
        <a href="#">Offers</a> 
        <a href="#">Contact</a> 
    </nav> 
</header> 
 
<main class="container"> 
    <h1>Explore Restaurants</h1> 
 
    <section class="restaurants"> 
 
        <article class="card"> 
            <img src="https://images.unsplash.com/photo-15131048901387c749659a591?w=400" alt="Pizza"> 
            <h3>Pizza Corner</h3> 
            <p>Italian Food - 4.5 ★</p> 
        </article> 
 
        <article class="card"> 
            <img src="https://images.unsplash.com/photo-156890134637523c9450c58cd?w=400" alt="Burger"> 
            <h3>Burger House</h3> 
            <p>Fast Food - 4.3 ★</p> 
        </article> 
 
        <article class="card"> 
            <img src="https://images.unsplash.com/photo-15697182121653a8278d5f624?w=400" alt="Noodles"> 
            <h3>Noodle Bowl</h3> 
            <p>Chinese - 4.6 ★</p> 
        </article> 
 
        <article class="card"> 
            <img src="https://images.unsplash.com/photo-1512621776951a57141f2eefd?w=400" alt="Salad"> 
            <h3>Green Garden</h3> 
            <p>Healthy Food - 4.4 ★</p> 
        </article> 
 
        <article class="card"> 
            <img src="https://images.unsplash.com/photo-1600891964599f61ba0e24092?w=400" alt="Indian food"> 
            <h3>Spice Hub</h3> 
            <p>Indian Food - 4.7 ★</p> 
        </article> 
 
        <article class="card"> 
            <img src="https://images.unsplash.com/photo-157898554506269928b1d9587?w=400" alt="Cake"> 
            <h3>Sweet Treats</h3> 
            <p>Desserts - 4.2 ★</p> 
        </article> 
 
    </section> 
</main> 
 
</body> 
</html>
