<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Hospital Appointment</title> 
</head> 
<body> 
 
<header> 
    <h1>KIMS Hospital</h1> 
    <p>Your Health, Our Priority</p> 
</header> 
 
<nav> 
    <a href="#services">Services</a> 
    <a href="#doctors">Doctors</a> 
    <a href="#appointment">Appointment</a> 
</nav> 
 
<main> 
    <section id="services"> 
        <h2>Our Services</h2> 
        <article> 
            <h3>Cardiology</h3> 
            <p>Heart care services.</p> 
        </article> 
        <article> 
            <h3>Neurology</h3> 
            <p>Brain and nerve care.</p> 
        </article> 
    </section> 
 
    <section id="doctors"> 
        <h2>Our Doctors</h2> 
        <article> 
            <h3>Dr. Kumar</h3> 
            <p>Cardiologist</p> 
        </article> 
    </section> 
 
    <section id="appointment"> 
        <h2>Book an Appointment</h2> 
 
        <form> 
            <label for="name">Patient Name:</label> 
            <input type="text" id="name" required><br><br>             <label for="email">Email:</label> 
            <input type="email" id="email" required><br><br> 
 
            <label for="phone">Phone:</label> 
            <input type="tel" id="phone" required><br><br> 
 
            <label for="date">Appointment Date:</label> 
            <input type="date" id="date" required><br><br> 
 
            <label for="doctor">Select Doctor:</label> 
            <select id="doctor"> 
                <option>Dr. Kumar</option> 
                <option>Dr. Ravi</option> 
            </select><br><br> 
 
            <label for="message">Health Details:</label> 
            <textarea id="message"></textarea><br><br> 
 
            <button type="submit">Book Appointment</button> 
        </form> 
    </section> 
</main> 
 
<footer> 
    <p>© 2026 KIMS Hospital</p> 
</footer> 
 
</body> 
</html>
