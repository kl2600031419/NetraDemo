<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo">N</div>
            <div>
                <h1>NETRA</h1>
                <p>ROBOT MISSION CONTROL</p>
            </div>                        
        </div>

        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#fleet">Fleet</a>
            <a href="#telemetry">Telemetry</a>
            <a href="#alerts">Alerts</a>
        </nav>

        <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSTEM ONLINE</span>
            <strong id="clock">--:--:--</strong>
            <button id="dispatch-open">+ Dispatch Mission</button>
        </div>
    </header>
    <!--Main Dashboard-->
    <main class="page">
        <section class="rstatus-grid">
            <article class="rstatus-card">
                <span>ROVER ONLINE</span>
                <h2 id="online-count">6 / 6</h2>
                <p>Active rover units</p>
            </article>
            <article class="rstatus-card">
                <span>AVERAGE BATTERY</span>
                <h2 id="average-battery">80%</h2>
                <p>Fleet battery level</p>
            </article>
            <article class="rstatus-card">
                <span>OPEN ALERTS</span>
                <h2 id="alert-count">0</h2>
                <p>Requires attention</p>
            </article>
            <article class="rstatus-card">
                <span>DISTANCE TODAY</span>
                <h2 id="distance">14.3 km</h2>
                <p>Total simulated distance</p>
            </article>
        </section>
    </main>
</body>
</html>
