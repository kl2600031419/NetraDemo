<html>
    <head>
        <title> Netra | Rover Control</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                padding: 20px 20px 20px 20px;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #e5eff8;
                color: #25234d;
            }
            header {
                text-align: center;
                margin-bottom: 40px;
            }
            .brand {
                font-size: 30px;
                font-weight: 800;
                letter-spacing: 2px;
                color: #9a1216;
                margin: 0 0 10px 0;
            }
            .subtitle {
                font-size: 18px;
                color: #62a63b;
                margin: 0;
            }
            .cards{
                display:grid;
                grid-template-columns: repeat(3,1fr);
                gap:20px;
            }
            .card {
                background-color: #dad5d5;
                border: 1px solid #760707;
                border-radius: 10px;
                padding: 20px;
                display: flex;
                flex-direction: 
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1 class="brand">NETRA</h1>
                <p class="subtitle">Campus Rover Control</p>
            </header>
            <div class="cards">
                <section class="card">
                    <div class="icon" aria-hidden="true">🚀</div>
                    <h2>Rover Deployment</h2>
                    <p class="status">Status: <span class="status-text" id="roverStatus">Standby</span></p>
                   <!--Implementation of Inline javascript-->
                    <button onclick="document.getElementById('roverStatus').textContent = 'Deployed'">Deploy Rover</button>
                </section>
                <section class="card">
                    <div class="icon" aria-hidden="true">🔋</div>
                    <h2>Battery Status</h2>
                    <p class="status">Status: <span class="status-text" id="batteryStatus">Normal</span></p>

                </section>
                <section class="card">
                    <div class="icon" aria-hidden="true">📡</div>
                    <h2>Campus Scanner</h2>
                    <p class="status">Status: <span class="status-text" id="scannerStatus">Active</span></p>

                </section>
            </div>
        </main>
    </body>
    </html>
